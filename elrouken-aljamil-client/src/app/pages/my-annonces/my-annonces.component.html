<div class="my-annonces-container">
  <h1>Mes annonces</h1>

  <div class="tabs">
    <div class="tab" [class.active]="activeTab === 'published'" (click)="setTab('published')">En ligne ({{ publishedCount }})</div>
    <div class="tab" [class.active]="activeTab === 'expired'" (click)="setTab('expired')">Expirées ({{ expiredCount }})</div>
  </div>

  <div class="search-bar">
    <input type="text" [(ngModel)]="searchText" placeholder="Recherchez dans vos annonces" (keyup.enter)="search()" />
    <button class="btn-search" (click)="search()">Rechercher</button>
  </div>

  <div class="annonces-list">
    <div class="ad-card" *ngFor="let ad of filteredAnnonces">
      <input type="checkbox" />
      <div class="ad-img"></div>
      <div class="ad-info">
        <div class="ad-title">{{ ad.title }}</div>
        <div class="ad-price">{{ ad.price }} TND</div>
        <div class="ad-meta">{{ ad.category }} · {{ getTimeAgo(ad.createdAt) }}</div>
        <button class="btn-promote">Vendez plus vite</button>
      </div>
      <div class="stats">
        <div>👁 0</div>
        <div>♥ 0</div>
      </div>
    </div>

    <div class="empty-state" *ngIf="filteredAnnonces.length === 0">
      <p>Aucune annonce trouvée.</p>
      <a routerLink="/deposer" class="btn-deposit">Déposer une annonce</a>
    </div>
  </div>
</div>
