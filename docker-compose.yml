services:

  # =============================================================
  # INFRASTRUCTURE
  # =============================================================

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: elrouken-sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Express
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - elrouken-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -Q 'SELECT 1' -No || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: elrouken-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=marketplace
      - RABBITMQ_DEFAULT_PASS=marketplace
      - RABBITMQ_DEFAULT_VHOST=marketplace
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - elrouken-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.15
    container_name: elrouken-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - elrouken-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: elrouken-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - elrouken-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: elrouken-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - elrouken-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================
  # MICROSERVICES
  # =============================================================

  identity-api:
    build:
      context: .
      dockerfile: ElroukenAljamil.Identity.API/Dockerfile
    container_name: elrouken-identity
    ports:
      - "5002:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__IdentityDb=Server=sqlserver;Database=marketplace_identity;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True
      - ConnectionStrings__RabbitMQ=amqp://marketplace:marketplace@rabbitmq:5672/marketplace
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=marketplace
      - RabbitMQ__Password=marketplace
      - RabbitMQ__VirtualHost=marketplace
      - Jwt__Secret=ElroukenAljamilSuperSecretKey2024!@#$%^&*
      - Jwt__Issuer=Marketplace.Identity
      - Jwt__Audience=Marketplace
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - elrouken-network

  listings-api:
    build:
      context: .
      dockerfile: ElroukenAljamil.Listings.API/Dockerfile
    container_name: elrouken-listings
    ports:
      - "5001:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__ListingsDb=Server=sqlserver;Database=marketplace_listings;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True
      - ConnectionStrings__RabbitMQ=amqp://marketplace:marketplace@rabbitmq:5672/marketplace
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=marketplace
      - RabbitMQ__Password=marketplace
      - RabbitMQ__VirtualHost=marketplace
      - Jwt__Secret=ElroukenAljamilSuperSecretKey2024!@#$%^&*
      - Jwt__Issuer=Marketplace.Identity
      - Jwt__Audience=Marketplace
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - elrouken-network

  messaging-api:
    build:
      context: .
      dockerfile: ElroukenAljamil.Messaging.API/Dockerfile
    container_name: elrouken-messaging
    ports:
      - "5003:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MessagingDb=Server=sqlserver;Database=marketplace_messaging;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True
      - ConnectionStrings__RabbitMQ=amqp://marketplace:marketplace@rabbitmq:5672/marketplace
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=marketplace
      - RabbitMQ__Password=marketplace
      - RabbitMQ__VirtualHost=marketplace
      - Jwt__Secret=ElroukenAljamilSuperSecretKey2024!@#$%^&*
      - Jwt__Issuer=Marketplace.Identity
      - Jwt__Audience=Marketplace
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - elrouken-network

  media-api:
    build:
      context: .
      dockerfile: ElroukenAljamil.Media.API/Dockerfile
    container_name: elrouken-media
    ports:
      - "5004:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MediaDb=Server=sqlserver;Database=marketplace_media;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True
      - ConnectionStrings__RabbitMQ=amqp://marketplace:marketplace@rabbitmq:5672/marketplace
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=marketplace
      - RabbitMQ__Password=marketplace
      - RabbitMQ__VirtualHost=marketplace
      - MinIO__Endpoint=minio:9000
      - MinIO__AccessKey=minioadmin
      - MinIO__SecretKey=minioadmin
      - MinIO__UseSSL=false
      - MinIO__PublicUrl=http://localhost:9000
      - Jwt__Secret=ElroukenAljamilSuperSecretKey2024!@#$%^&*
      - Jwt__Issuer=Marketplace.Identity
      - Jwt__Audience=Marketplace
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - elrouken-network

  search-api:
    build:
      context: .
      dockerfile: ElroukenAljamil.Search.API/Dockerfile
    container_name: elrouken-search
    ports:
      - "5005:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Elasticsearch__Url=http://elasticsearch:9200
      - Elasticsearch__DefaultIndex=listings
      - ConnectionStrings__RabbitMQ=amqp://marketplace:marketplace@rabbitmq:5672/marketplace
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=marketplace
      - RabbitMQ__Password=marketplace
      - RabbitMQ__VirtualHost=marketplace
      - Jwt__Secret=ElroukenAljamilSuperSecretKey2024!@#$%^&*
      - Jwt__Issuer=Marketplace.Identity
      - Jwt__Audience=Marketplace
    depends_on:
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - elrouken-network

  notification-api:
    build:
      context: .
      dockerfile: ElroukenAljamil.Notification.API/Dockerfile
    container_name: elrouken-notification
    ports:
      - "5006:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__NotificationDb=Server=sqlserver;Database=marketplace_notification;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True
      - ConnectionStrings__RabbitMQ=amqp://marketplace:marketplace@rabbitmq:5672/marketplace
      - ConnectionStrings__Redis=redis:6379
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=marketplace
      - RabbitMQ__Password=marketplace
      - RabbitMQ__VirtualHost=marketplace
      - Jwt__Secret=ElroukenAljamilSuperSecretKey2024!@#$%^&*
      - Jwt__Issuer=Marketplace.Identity
      - Jwt__Audience=Marketplace
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - elrouken-network

  # =============================================================
  # API GATEWAY
  # =============================================================

  api-gateway:
    build:
      context: ./ElroukenAljamil.ApiGateway
      dockerfile: Dockerfile
    container_name: elrouken-gateway
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Secret=ElroukenAljamilSuperSecretKey2024!@#$%^&*
      - Jwt__Issuer=Marketplace.Identity
      - Jwt__Audience=Marketplace
    depends_on:
      - listings-api
      - identity-api
      - messaging-api
      - media-api
      - search-api
      - notification-api
    networks:
      - elrouken-network

  # =============================================================
  # FRONTEND
  # =============================================================

  frontend:
    build:
      context: ./elrouken-aljamil-client
      dockerfile: Dockerfile
    container_name: elrouken-frontend
    ports:
      - "4200:80"
    depends_on:
      - api-gateway
    networks:
      - elrouken-network

networks:
  elrouken-network:
    driver: bridge

volumes:
  sqlserver-data:
  rabbitmq-data:
  elasticsearch-data:
  redis-data:
  minio-data:
